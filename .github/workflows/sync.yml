name: Shopify Mediven Sync

on:
  schedule:
    - cron: '14 * * * *' # Se ejecuta en el minuto 14 de cada hora (evita el embotellamiento de GitHub)
  workflow_dispatch:   # Permite ejecutarlo manualmente

# IMPORTANTE: Damos permiso al robot para guardar cambios en el repositorio
permissions:
  contents: write

# --- SEMÁFORO ---
# Si una ejecución se demora mucho y llega la hora de la siguiente,
# cancela la vieja (zombie) y arranca la nueva limpia.
concurrency:
  group: "robot-sync"
  cancel-in-progress: true
# ----------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5            # ⬆️ v4 → v5 (Node 24)

      - name: Configurar Python
        uses: actions/setup-python@v6        # ⬆️ v5 → v6 (Node 24)
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # anthropic (Claude: imágenes), google-genai (textos IA), rich (logs), ShopifyAPI y Pillow (Imágenes)
          pip install requests pandas openpyxl python-dotenv anthropic google-genai rich ShopifyAPI Pillow

      - name: Ejecutar Sincronización Completa (Sync + IA + Imágenes)
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          MEDIVEN_USER: ${{ secrets.MEDIVEN_USER }}
          MEDIVEN_PASS: ${{ secrets.MEDIVEN_PASS }}
          SHOPIFY_LOCATION_ID: ${{ secrets.SHOPIFY_LOCATION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # --- MOTOR DE IMÁGENES (CLAUDE) ---
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modelo opcional (default claude-opus-5-5). Para abaratar: claude-sonnet-5-5 o claude-haiku-5-5
          CLAUDE_MODEL_IMAGENES: ${{ vars.CLAUDE_MODEL_IMAGENES || 'claude-opus-5-5' }}
          IMAGENES_LIMITE_NUEVOS: ${{ vars.IMAGENES_LIMITE_NUEVOS || '15' }}
          IMAGENES_LIMITE_REPESCA: ${{ vars.IMAGENES_LIMITE_REPESCA || '5' }}
          SHOPIFY_DEFAULT_IMAGE_URL: ${{ secrets.SHOPIFY_DEFAULT_IMAGE_URL }}
          # --- ESPÍA DE PRECIOS (SERPER) ---
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # ------------------------------------------------------
          SIMULATE: "false"
          DELETE_MISSING: "true"
          LIMITE_DIARIO: "300"
          DIAS_REINTENTO_MONOPOLIO: "7"
        # Ejecutamos sync.py (el orquestador)
        run: python sync.py

      # Guardar TODO lo que el robot aprendió (IA, Imágenes y Precios)
      - name: Guardar memoria de IA, Imágenes y Precios en el repo
        uses: stefanzweifel/git-auto-commit-action@v7   # ⬆️ v6 → v7 (Node 24)
        with:
          commit_message: "🤖 BOT: Memoria actualizada (Textos + Imágenes + Precios)"
          file_pattern: 'data/*.json'

      - name: Guardar Reporte Excel
        if: always()
        uses: actions/upload-artifact@v6              # ⬆️ v4 → v6 (Node 24)
        with:
          name: reporte-sincronizacion
          path: reportes/*.xlsx
          retention-days: 7
